name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/reviewreply_e2e?schema=public
  BETTER_AUTH_SECRET: reviewreply-e2e-auth-secret-2026-at-least-32-characters
  BETTER_AUTH_URL: http://127.0.0.1:3000
  APP_ENCRYPTION_KEY: reviewreply-e2e-encryption-key-2026-32-characters
  INSTALLATION_TOKEN: reviewreply-e2e-installation-token
  NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
  E2E_BASE_URL: http://127.0.0.1:3000
  E2E_USER_EMAIL: customer@reviewreply-e2e.local
  E2E_USER_PASSWORD: ReviewReply-E2E-2026!
  E2E_ADMIN_EMAIL: admin@reviewreply-e2e.local
  E2E_ADMIN_PASSWORD: ReviewReply-E2E-2026!
  E2E_MUTATING: "true"

jobs:
  quality:
    name: Quality and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:ci

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Validate Prisma schema
        run: pnpm exec prisma validate

      - name: Production build
        run: pnpm build

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reviewreply_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d reviewreply_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: pnpm exec prisma migrate deploy

      - name: Seed plans and installation state
        run: pnpm db:seed

      - name: Seed isolated E2E accounts
        run: pnpm e2e:seed

      - name: Build application
        run: pnpm build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright suite
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
